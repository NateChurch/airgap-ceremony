# GnuPG's internal CCID driver and pcscd both claim exclusive access to the
# YubiKey. ykman and yubico-piv-tool require pcscd. If GnuPG uses its own
# driver, whichever process touches the token first wins and the other gets
# "card not present" or a hung scdaemon.
#
# Force GnuPG through pcscd so there is exactly one thing talking to the CCID
# interface. Discovering this mid-ceremony costs you a reboot and your place in
# a multi-step procedure.
disable-ccid

# Do not disconnect between operations; reduces spurious re-select races when
# ykman and gpg are used in the same session.
card-timeout 5
