# Structural air-gap. Removing firmware from the image stops most radios from
# working; refusing to load the 802.11 and Bluetooth stacks at all stops the
# rest, including any adapter someone plugs in later by mistake.
#
# Same reasoning as Talos shipping no shell: do not rely on nobody logging in.
install cfg80211 /bin/false
install mac80211 /bin/false
install bluetooth /bin/false
install btusb /bin/false
install btintel /bin/false
install btrtl /bin/false
install btbcm /bin/false
install rfcomm /bin/false
install bnep /bin/false

# Firewire and Thunderbolt DMA are a memory-disclosure path against a machine
# holding key material in RAM.
install firewire_core /bin/false
install firewire_ohci /bin/false
install thunderbolt /bin/false
